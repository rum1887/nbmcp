name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --lib
        name: Run cargo test

  python-tests:
    name: Python tests (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: 'pip install "maturin>=1.4,<2.0"'
      - name: Build native extension
        run: maturin develop
      - name: Install dev dependencies
        run: pip install ruff pytest pytest-timeout
      - name: Run ruff
        run: ruff check python/ examples/ --no-fix || true
      - name: Run pytest
        run: python -m pytest tests/ -v --timeout=60

  lint:
    name: Lint (cargo clippy + rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo clippy -- -D warnings
        name: Run clippy
      - run: cargo fmt --check
        name: Check formatting
