[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "nbmcp"
version = "0.1.0"
description = "A fast MCP server framework: Rust transport, routing, and schema validation; Python tool bodies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "rust", "pyo3"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
python-source = "python"
module-name = "nbmcp._nbmcp_core"
features = ["pyo3/extension-module"]
