[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "nbmcp"
version = "0.1.0"
description = "A fast MCP server framework: Rust transport, routing, and schema validation; Python tool bodies."
readme = "README.md"
readme-content-type = "text/markdown"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "rust", "pyo3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []
optional-dependencies = { dev = ["ruff>=0.0.1", "pytest>=8.0", "pytest-timeout>=2.0", "maturin>=1.4,<2.0"] }

[project.urls]
Homepage = "https://github.com/rum1887/nbmcp"
Repository = "https://github.com/rum1887/nbmcp"
Documentation = "https://github.com/rum1887/nbmcp"

[tool.maturin]
python-source = "python"
module-name = "nbmcp._nbmcp_core"
features = ["pyo3/extension-module"]
