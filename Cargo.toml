[package]
name = "nbmcp_core"
version = "0.1.0"
edition = "2021"
description = "Rust transport, routing, and schema validation core for nbmcp"

[lib]
# Must match the module name imported from Python (see python/nbmcp/__init__.py)
name = "_nbmcp_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "sync", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hyper = { version = "0.14", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
